version: '3.8'
services:
  app:
    build: .
    container_name: backend3-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./src/public/img:/app/src/public/img
      - ./src/public/documents:/app/src/public/documents
      - ./src/logs:/app/src/logs
    restart: unless-stopped