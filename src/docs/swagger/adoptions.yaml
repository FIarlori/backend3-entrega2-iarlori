paths:
  /api/adoptions:
    get:
      tags:
        - Adoptions
      summary: Obtener todas las adopciones
      description: Retorna una lista de todas las adopciones registradas
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de adopciones obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adoption'
        '401':
          description: No autenticado
        '500':
          description: Error interno del servidor

  /api/adoptions/{aid}:
    get:
      tags:
        - Adoptions
      summary: Obtener adopción por ID
      description: Retorna la información de una adopción específica
      security:
        - cookieAuth: []
      parameters:
        - name: aid
          in: path
          required: true
          description: ID de la adopción (ObjectId de MongoDB)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: Adopción encontrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Adoption'
        '400':
          description: ID inválido o formato incorrecto
        '404':
          description: Adopción no encontrada
        '500':
          description: Error interno del servidor

  /api/adoptions/{uid}/{pid}:
    post:
      tags:
        - Adoptions
      summary: Crear una adopción
      description: Crea una nueva adopción asociando un usuario con una mascota
      security:
        - cookieAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario que adopta
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: '507f1f77bcf86cd799439011'
        - name: pid
          in: path
          required: true
          description: ID de la mascota a adoptar
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: '507f1f77bcf86cd799439012'
      responses:
        '200':
          description: Adopción creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: "Pet adopted"
        '400':
          description: IDs inválidos, mascota ya adoptada o datos incorrectos
        '404':
          description: Usuario o mascota no encontrados
        '500':
          description: Error interno del servidor